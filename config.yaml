# StockSpikes Configuration

# Stock symbols to monitor
symbols:
  - RIVN
  - BNED
  - TSLA
  - NVDA
  - GOOGL

# Volatility detection settings
volatility:
  # Sharp move threshold in percentage (daily change).
  # Severity bands (T = threshold): low < T, medium < 3T, high >= 3T
  # Alerts are stored when |change| >= T (medium/high).
  threshold: 5.0

  # Period to analyze (in days)
  lookback_days: 365

# Scheduler settings
scheduler:
  # Interval between analysis runs (in hours)
  interval_hours: 4

# Alert settings
alerts:
  # Maximum number of alerts to keep
  max_history: 1000
  # Days to keep alert history
  retention_days: 90

# Display timezone (CT/ET/PT/MT or IANA e.g. America/Chicago)
timezone: CT
